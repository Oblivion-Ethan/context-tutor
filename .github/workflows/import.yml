name: Import source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack archive
        run: |
          ARCHIVE=$(ls context-tutor*.zip | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "no archive found"
            exit 1
          fi
          rm -rf /tmp/src
          mkdir -p /tmp/src
          unzip -o "$ARCHIVE" -d /tmp/src
          if [ -d /tmp/src/context-tutor ]; then
            cp -R /tmp/src/context-tutor/. .
          else
            cp -R /tmp/src/. .
          fi
          rm -rf /tmp/src "$ARCHIVE"
          rm -f .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "import context-tutor source"
          git push
