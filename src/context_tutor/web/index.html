<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContextTutor · 语境阅读</title>
<style>
  :root {
    --paper: #f1eadc;
    --paper-deep: #e7ddcc;
    --ink: #201d18;
    --ink-soft: #625b50;
    --ink-faint: #8f8577;
    --rule: #d2c6b3;
    --accent: #a93f2b;
    --accent-soft: #f2ddd4;
    --green: #3f6049;
    --panel: #f7f2e7;
    --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", "Songti SC", "Noto Serif CJK SC", Georgia, serif;
    --mono: "SFMono-Regular", "Menlo", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    color: var(--ink);
    background: var(--paper);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    padding: 14px 26px;
    background: rgba(241, 234, 220, .96);
    border-bottom: 1px solid var(--rule);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand-mark { font-family: var(--serif); font-size: 26px; letter-spacing: -.02em; }
  .brand-mark em { font-style: italic; color: var(--accent); }
  .brand-sub { color: var(--ink-soft); font-size: 12px; letter-spacing: .04em; white-space: nowrap; }
  .tabs { display: flex; align-items: center; gap: 4px; }
  .tab {
    border: 0; background: transparent; cursor: pointer;
    padding: 8px 13px; border-bottom: 2px solid transparent;
    color: var(--ink-soft); font-size: 14px;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tab .count {
    display: inline-block; min-width: 18px; padding: 1px 5px; margin-left: 4px;
    border: 1px solid var(--rule); font-family: var(--mono); font-size: 10px; line-height: 1.4;
    color: var(--accent); text-align: center;
  }
  .local-note { color: var(--ink-faint); font-size: 11px; white-space: nowrap; }

  .shell {
    display: grid;
    grid-template-columns: 248px minmax(0, 1fr) 390px;
    max-width: 1500px; margin: 0 auto; min-height: calc(100vh - 65px);
  }
  body.mode-review .shell { grid-template-columns: minmax(0, 1fr); max-width: 1120px; }
  body.mode-review .rail, body.mode-review .panel { display: none; }

  .rail {
    border-right: 1px solid var(--rule);
    padding: 26px 18px 32px;
    position: sticky; top: 65px; height: calc(100vh - 65px);
    overflow: auto;
  }
  .rail-title {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 0 4px 14px;
    color: var(--ink-soft); font-size: 12px;
  }
  .rail-title b { font-weight: 600; color: var(--ink); letter-spacing: .03em; }
  .source-list { display: grid; gap: 2px; }
  .source-item {
    width: 100%; text-align: left; cursor: pointer;
    border: 0; border-left: 3px solid transparent;
    background: transparent; padding: 10px 10px 10px 11px;
  }
  .source-item:hover { background: rgba(255,255,255,.25); }
  .source-item.active { border-left-color: var(--accent); background: var(--panel); }
  .source-item .st { display: block; font-family: var(--serif); font-size: 15px; line-height: 1.35; }
  .source-item .sm { display: block; margin-top: 4px; color: var(--ink-faint); font-size: 11px; }
  .source-item .dot {
    display: inline-block; width: 5px; height: 5px; margin-right: 5px;
    background: var(--accent); border-radius: 50%; vertical-align: 1px;
  }
  .rail-foot {
    margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--rule);
    color: var(--ink-soft); font-size: 11px; line-height: 1.9;
  }
  .rail-foot b { color: var(--ink); font-weight: 600; }

  .reader { padding: 38px clamp(24px, 4vw, 52px) 80px; min-width: 0; }
  .source-head { max-width: 760px; margin-bottom: 30px; }
  .kicker { color: var(--accent); font-size: 11px; letter-spacing: .08em; margin-bottom: 8px; }
  .source-head h1 {
    margin: 0; font-family: var(--serif); font-weight: 500;
    font-size: clamp(28px, 3.2vw, 40px); line-height: 1.22; letter-spacing: -.02em;
  }
  .source-meta { display: flex; flex-wrap: wrap; gap: 7px 16px; margin-top: 14px; color: var(--ink-soft); font-size: 12px; }
  .source-meta span { white-space: nowrap; }
  .source-meta i { font-style: normal; color: var(--ink-faint); }

  .sentences { max-width: 760px; }
  .sentence {
    position: relative; margin: 0; padding: 13px 0 14px 16px;
    border-bottom: 1px dotted rgba(98, 91, 80, .22);
    cursor: text; transition: background .18s ease;
  }
  .sentence:hover { background: rgba(255,255,255,.22); }
  .sentence.active { background: var(--panel); }
  .sentence.active::before {
    content: ""; position: absolute; left: 0; top: 12px; bottom: 12px;
    width: 2px; background: var(--accent);
  }
  .sentence .sn {
    position: absolute; left: -36px; top: 19px;
    color: var(--ink-faint); font-family: var(--mono); font-size: 10px;
    width: 26px; text-align: right;
  }
  .sentence .txt {
    margin: 0; font-family: var(--serif); font-size: 18.5px; line-height: 1.95;
    letter-spacing: .005em; overflow-wrap: anywhere;
  }
  .w {
    display: inline; border: 0; padding: 0; background: transparent;
    cursor: pointer; font-family: inherit; font-size: inherit; line-height: inherit;
    color: inherit; border-bottom: 1px solid transparent;
  }
  .w:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .w.cand { border-bottom: 1px dotted rgba(169, 63, 43, .55); }
  .w.cand:hover { background: var(--accent-soft); }

  .empty, .onboarding { max-width: 660px; padding: 34px 0; }
  .onboarding h1 { margin: 0 0 10px; font-family: var(--serif); font-weight: 500; font-size: 32px; }
  .onboarding p, .muted { color: var(--ink-soft); font-size: 14px; line-height: 1.8; }
  .onboarding pre {
    margin: 20px 0 0; padding: 16px 18px; overflow: auto;
    background: #26221d; color: #f0e8d8; font-family: var(--mono); font-size: 12px; line-height: 1.8;
  }

  .panel {
    border-left: 1px solid var(--rule);
    background: var(--panel);
    padding: 28px 24px 60px;
    position: sticky; top: 65px; height: calc(100vh - 65px); overflow: auto;
  }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .panel-head h2 { margin: 0; font-family: var(--serif); font-size: 20px; font-weight: 500; }
  .panel-head .hint { color: var(--ink-faint); font-size: 10px; }
  .sentence-quote {
    margin: 0 0 18px; padding: 0 0 16px; border-bottom: 1px solid var(--rule);
    font-family: var(--serif); font-size: 15.5px; line-height: 1.8; color: var(--ink-soft);
  }
  .structure { display: grid; gap: 9px; margin-bottom: 20px; }
  .struct-row { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; font-size: 12px; line-height: 1.65; }
  .struct-row dt { margin: 0; color: var(--ink-faint); }
  .struct-row dd { margin: 0; color: var(--ink-soft); overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    border: 1px solid var(--rule); background: transparent; cursor: pointer;
    padding: 3px 7px; font-size: 11px; color: var(--ink-soft); font-family: var(--mono);
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  .word-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 12px; }
  .word-head .word { font-family: var(--serif); font-size: 25px; }
  .word-head .label { color: var(--ink-faint); font-size: 11px; }
  .ctx-card {
    border-top: 1px solid var(--rule); padding: 14px 0 16px;
  }
  .card-line { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .card-line .surface { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  .tag { padding: 2px 6px; font-size: 10px; line-height: 1.4; border: 1px solid var(--rule); color: var(--ink-soft); }
  .tag.draft { color: var(--accent); border-color: rgba(169,63,43,.35); background: var(--accent-soft); }
  .tag.reviewed { color: var(--green); border-color: rgba(63,96,73,.35); }
  .conf { margin-left: auto; color: var(--ink-faint); font-family: var(--mono); font-size: 10px; }
  .sense { margin: 0 0 8px; font-size: 16px; line-height: 1.6; }
  .field { margin: 0 0 7px; color: var(--ink-soft); font-size: 12px; line-height: 1.7; }
  .field b { color: var(--ink); font-weight: 600; }
  .field .en { font-family: var(--serif); font-size: 13px; }
  .card-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .mini {
    border: 1px solid var(--rule); background: transparent; cursor: pointer;
    padding: 4px 9px; font-size: 11px; color: var(--ink-soft);
  }
  .mini:hover { border-color: var(--ink-soft); color: var(--ink); }
  .mini.go { border-color: rgba(63,96,73,.4); color: var(--green); }
  .mini.stop:hover { border-color: var(--accent); color: var(--accent); }

  .review-view { padding: 38px clamp(24px, 5vw, 64px) 80px; }
  .review-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid var(--rule); }
  .review-head h1 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 30px; }
  .review-head p { margin: 6px 0 0; color: var(--ink-soft); font-size: 12px; }
  .review-list { display: grid; gap: 0; }
  .review-item {
    display: grid; grid-template-columns: 58px minmax(0, 1fr) 300px;
    gap: 18px; padding: 18px 0; border-bottom: 1px dotted var(--rule);
  }
  .review-item .idx { color: var(--ink-faint); font-family: var(--mono); font-size: 10px; }
  .review-item .rtext { margin: 0; font-family: var(--serif); font-size: 16px; line-height: 1.8; }
  .review-item .rmeta { margin-top: 7px; color: var(--ink-faint); font-size: 10px; }
  .review-card { border-left: 2px solid var(--accent); padding-left: 12px; }
  .review-card .sense { font-size: 14px; }
  .review-card .card-actions { margin-top: 8px; }

  .loading { color: var(--ink-faint); font-size: 12px; padding: 10px 0; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
    z-index: 50; padding: 9px 14px; background: #26221d; color: #f6eedf;
    font-size: 12px; opacity: 0; pointer-events: none; transition: .2s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1100px) {
    .shell { grid-template-columns: 210px minmax(0, 1fr) 340px; }
  }
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: 16px 20px; }
    .source-list { display: flex; overflow-x: auto; gap: 4px; }
    .source-item { min-width: 190px; border-left: 0; border-bottom: 2px solid transparent; }
    .source-item.active { border-left-color: transparent; border-bottom-color: var(--accent); }
    .rail-foot { display: none; }
    .panel { position: static; height: auto; border-left: 0; border-top: 1px solid var(--rule); }
    .review-item { grid-template-columns: 34px minmax(0, 1fr); }
    .review-card { grid-column: 2; }
  }
  @media (max-width: 600px) {
    .topbar { padding: 10px 14px; gap: 10px; }
    .brand-sub, .local-note { display: none; }
    .brand-mark { font-size: 21px; }
    .reader { padding: 24px 18px 50px; }
    .sentence { padding-left: 7px; }
    .sentence .sn { display: none; }
    .sentence .txt { font-size: 17px; line-height: 1.9; }
    .panel { padding: 22px 18px 40px; }
    .review-view { padding: 24px 18px 50px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">Context<em>Tutor</em></div>
    <div class="brand-sub">语境阅读 · 一个词先看它在句里做什么</div>
  </div>
  <div class="tabs" role="tablist" aria-label="视图">
    <button class="tab active" data-mode="read" role="tab" aria-selected="true">阅读</button>
    <button class="tab" data-mode="review" role="tab" aria-selected="false">校对<span class="count" id="draftCount">0</span></button>
  </div>
  <div class="local-note">本地 · 数据不上传</div>
</header>

<main class="shell">
  <aside class="rail">
    <div class="rail-title"><b>文章</b><span id="sourceTotal">0</span></div>
    <nav class="source-list" id="sourceList"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>

  <section class="reader" id="reader">
    <div class="loading">正在读取本地库…</div>
  </section>

  <aside class="panel" id="panel">
    <div class="panel-head"><h2>语境卡</h2><span class="hint">点击句中的词</span></div>
    <p class="muted">选中一个句子后，这里会显示它的主干、修饰和候选词；点击任意英文词，查它在这句里的意思。</p>
  </aside>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  const state = {
    mode: "read",
    overview: null,
    source: null,
    sentenceId: null,
    word: null,
    lookup: null,
    review: [],
  };

  const $ = (id) => document.getElementById(id);
  const reader = $("reader");
  const panel = $("panel");
  const sourceList = $("sourceList");
  const railFoot = $("railFoot");
  const draftCount = $("draftCount");
  const toastEl = $("toast");
  let toastTimer = 0;

  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[ch]));

  const kindLabel = (kind) => ({ article: "文章", textbook: "教材", paper: "论文", notes: "笔记" }[kind] || kind || "文本");
  const statusLabel = (status) => ({ draft: "草稿", reviewed: "已校对", retired: "已退役" }[status] || status);
  const wordKey = (value) => String(value || "").toLowerCase().replace(/[^a-z'’-]/g, "");
  const confidence = (value) => {
    const number = Number(value);
    return Number.isFinite(number) && number > 0 ? number.toFixed(2) : "未置信";
  };
  const sentenceLabel = (index) => String(index + 1).padStart(2, "0");

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  async function api(path, options = {}) {
    const response = await fetch(path, {
      headers: { "Content-Type": "application/json" },
      cache: "no-store",
      ...options,
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || `请求失败（${response.status}）`);
    return data;
  }

  function renderSources() {
    const overview = state.overview;
    if (!overview) return;
    $("sourceTotal").textContent = String(overview.sources.length);
    draftCount.textContent = String(overview.stats.draft_context_cards || 0);
    const current = state.source?.source?.id;
    sourceList.innerHTML = overview.sources.map((source) => {
      const active = source.id === current ? " active" : "";
      const draft = source.draft_count > 0 ? `<i class="dot"></i>` : "";
      return `<button class="source-item${active}" data-source="${esc(source.id)}" type="button">
        <span class="st">${esc(source.title)}</span>
        <span class="sm">${draft}${source.sentence_count} 句 · ${source.card_count} 张卡</span>
      </button>`;
    }).join("") || `<p class="muted" style="padding:0 4px">还没有文章。</p>`;

    const stats = overview.stats;
    railFoot.innerHTML = `
      <div><b>${stats.sentences}</b> 个句子卡</div>
      <div><b>${stats.context_cards}</b> 张语境卡</div>
      <div><b>${stats.draft_context_cards}</b> 张待校对</div>
    `;
  }

  function wordHtml(token, candidates) {
    if (!/[A-Za-z]/.test(token)) return esc(token);
    const key = wordKey(token);
    const isCandidate = candidates.has(key) ? " cand" : "";
    return `<button class="w${isCandidate}" type="button" data-word="${esc(key)}" title="查这个词在这句里的意思">${esc(token)}</button>`;
  }

  function sentenceHtml(sentence, index) {
    const candidates = new Set((sentence.candidate_words || []).map(wordKey).filter(Boolean));
    const parts = sentence.text.split(/([A-Za-z][A-Za-z'’-]*)/g);
    const html = parts.map((part) => wordHtml(part, candidates)).join("");
    const active = sentence.id === state.sentenceId ? " active" : "";
    return `<article class="sentence${active}" id="s-${esc(sentence.id)}" data-sentence="${esc(sentence.id)}">
      <span class="sn">${sentenceLabel(index)}</span>
      <p class="txt">${html}</p>
    </article>`;
  }

  function renderReader() {
    if (!state.overview) return;
    if (!state.overview.sources.length) {
      reader.innerHTML = `<div class="onboarding">
        <div class="kicker">开始</div>
        <h1>先把一篇文章放进来。</h1>
        <p>这里读的是你自己本地的文本，不会上传到任何地方。入库后，句子会被切开，候选词会被标出来。</p>
        <pre><code>context-tutor --data-dir data init
context-tutor --data-dir data ingest examples/article.txt --title "Context matters"
context-tutor --data-dir data enrich --adapter mock
context-tutor --data-dir data serve</code></pre>
        <p style="margin-top:16px">mock 只写占位义。要真实语境义，把 <code>--adapter mock</code> 换成 <code>--adapter openai</code>，并设置 API 环境变量。</p>
      </div>`;
      panel.innerHTML = `<div class="panel-head"><h2>语境卡</h2><span class="hint">等待文章</span></div><p class="muted">左侧还没有文章。</p>`;
      return;
    }
    if (!state.source) {
      reader.innerHTML = `<div class="empty"><p class="muted">正在载入文章…</p></div>`;
      return;
    }

    const source = state.source.source;
    const sentences = state.source.sentences;
    const cardCount = sentences.reduce((total, sentence) => total + (sentence.context_cards || []).length, 0);
    const meta = [
      kindLabel(source.kind),
      source.author ? `${esc(source.author)}` : "",
      source.edition ? `${esc(source.edition)}` : "",
      `${sentences.length} 句`,
      `${cardCount} 张语境卡`,
    ].filter(Boolean).join("<i> · </i>");

    reader.innerHTML = `<header class="source-head">
      <div class="kicker">${esc(kindLabel(source.kind))}</div>
      <h1>${esc(source.title)}</h1>
      <div class="source-meta"><span>${meta}</span></div>
    </header>
    <div class="sentences">${sentences.map(sentenceHtml).join("")}</div>`;

    if (!sentences.length) {
      reader.innerHTML += `<div class="empty"><p class="muted">这篇文章没有切出句子。</p></div>`;
    }
  }

  function findSentence(id) {
    return state.source?.sentences?.find((sentence) => sentence.id === id) || null;
  }

  function currentSentence() {
    return findSentence(state.sentenceId);
  }

  function renderCard(card, options = {}) {
    const canApprove = card.status === "draft";
    const canReopen = card.status === "reviewed";
    const actions = [];
    if (canApprove) actions.push(`<button class="mini go" type="button" data-card-status="reviewed">标为已校对</button>`);
    if (canReopen) actions.push(`<button class="mini" type="button" data-card-status="draft">撤回为草稿</button>`);
    if (card.status !== "retired") actions.push(`<button class="mini stop" type="button" data-card-status="retired">退役</button>`);
    return `<article class="ctx-card" data-card="${esc(card.id)}">
      <div class="card-line">
        <span class="surface">${esc(card.surface)}</span>
        <span class="tag ${esc(card.status)}">${statusLabel(card.status)}</span>
        ${options.showWord ? `<button class="chip" type="button" data-word="${esc(wordKey(card.surface))}">${esc(card.surface)}</button>` : ""}
        <span class="conf">${confidence(card.confidence)}</span>
      </div>
      <p class="sense">${esc(card.sense)}</p>
      ${card.why ? `<p class="field"><b>依据</b> ${esc(card.why)}</p>` : ""}
      ${card.collocations?.length ? `<p class="field"><b>搭配</b> ${card.collocations.map((item) => `<span class="en">${esc(item)}</span>`).join(" · ")}</p>` : ""}
      ${card.register ? `<p class="field"><b>语域</b> ${esc(card.register)}</p>` : ""}
      ${card.example ? `<p class="field"><b>例句</b> <span class="en">${esc(card.example)}</span></p>` : ""}
      <div class="card-actions">${actions.join("")}</div>
    </article>`;
  }

  function renderPanel(loading = false) {
    const sentence = currentSentence();
    if (!sentence) {
      panel.innerHTML = `<div class="panel-head"><h2>语境卡</h2><span class="hint">点击句中的词</span></div><p class="muted">先选一个句子。</p>`;
      return;
    }
    const index = state.source.sentences.indexOf(sentence);
    const candidates = sentence.candidate_words || [];
    const base = `<div class="panel-head"><h2>句 ${sentenceLabel(index)}</h2><span class="hint">${esc(sentence.difficulty || "")}</span></div>
      <p class="sentence-quote">${esc(sentence.text)}</p>
      <dl class="structure">
        <div class="struct-row"><dt>主干</dt><dd>${esc(sentence.main_clause || "—")}</dd></div>
        <div class="struct-row"><dt>修饰</dt><dd>${sentence.modifiers?.length ? esc(sentence.modifiers.join("；")) : "—"}</dd></div>
        <div class="struct-row"><dt>候选</dt><dd>${candidates.length ? `<span class="chips">${candidates.map((word) => `<button class="chip" type="button" data-word="${esc(wordKey(word))}">${esc(word)}</button>`).join("")}</span>` : "—"}</dd></div>
        <div class="struct-row"><dt>来源</dt><dd>${esc(sentence.source_id.slice(0, 8))}</dd></div>
      </dl>`;

    if (!state.word) {
      const cards = sentence.context_cards || [];
      panel.innerHTML = base + `<div class="word-head"><span class="word">本句</span><span class="label">${cards.length} 张语境卡</span></div>
        ${cards.length ? cards.map((card) => renderCard(card, { showWord: true })).join("") : `<p class="muted">这句还没有语境卡。先运行 <code>enrich</code>，或用真实适配器重新生成。</p>`}`;
      return;
    }

    if (loading) {
      panel.innerHTML = base + `<div class="word-head"><span class="word">${esc(state.word)}</span><span class="label">查询中…</span></div><div class="loading">正在查本地语境卡。</div>`;
      return;
    }
    const result = state.lookup;
    const contexts = result?.contexts || [];
    panel.innerHTML = base + `<div class="word-head"><span class="word">${esc(state.word)}</span><span class="label">在这句里的意思</span></div>
      ${contexts.length ? contexts.map((card) => renderCard(card)).join("") : `<p class="muted">这个词还没有语境卡。可能是适配器没跑，或这张卡已被退役。</p>`}
      ${result?.sentences?.length > 1 ? `<p class="field" style="margin-top:14px"><b>其他出现</b> ${result.sentences.slice(1).map((item) => `<button class="chip" type="button" data-goto="${esc(item.id)}">句 ${esc(item.id.slice(0, 4))}</button>`).join(" ")}</p>` : ""}`;
  }

  async function selectSentence(id, word = null, scroll = false) {
    state.sentenceId = id;
    state.word = word ? wordKey(word) : null;
    state.lookup = null;
    document.querySelectorAll(".sentence").forEach((element) => {
      element.classList.toggle("active", element.dataset.sentence === id);
    });
    if (scroll) {
      document.getElementById(`s-${id}`)?.scrollIntoView({ block: "center", behavior: "smooth" });
    }
    renderPanel(Boolean(word));
    if (word) {
      try {
        const data = await api(`/api/lookup?word=${encodeURIComponent(word)}&sentence_id=${encodeURIComponent(id)}`);
        if (state.sentenceId === id && state.word === wordKey(word)) {
          state.lookup = data;
          renderPanel();
        }
      } catch (error) {
        showToast(error.message);
        renderPanel();
      }
    }
  }

  async function selectWord(word) {
    if (!state.sentenceId) return;
    await selectSentence(state.sentenceId, word, false);
  }

  async function loadSource(id, keep = {}) {
    const data = await api(`/api/source?id=${encodeURIComponent(id)}`);
    state.source = data;
    const first = data.sentences[0]?.id || null;
    const target = keep.sentenceId && data.sentences.some((sentence) => sentence.id === keep.sentenceId) ? keep.sentenceId : first;
    state.sentenceId = target;
    state.word = null;
    state.lookup = null;
    renderReader();
    renderSources();
    if (target) {
      await selectSentence(target, keep.word || null, false);
    } else {
      renderPanel();
    }
  }

  async function refreshOverview() {
    state.overview = await api("/api/overview");
    renderSources();
  }

  function patchCard(cardId, status) {
    if (state.source) {
      for (const sentence of state.source.sentences) {
        sentence.context_cards = (sentence.context_cards || []).filter((card) => {
          if (card.id !== cardId) return true;
          if (status === "retired") return false;
          card.status = status;
          return true;
        });
      }
    }
    if (state.lookup) {
      state.lookup.contexts = (state.lookup.contexts || []).filter((card) => {
        if (card.id !== cardId) return true;
        if (status === "retired") return false;
        card.status = status;
        return true;
      });
    }
    if (state.review.length) {
      state.review = state.review.filter((card) => card.id !== cardId);
    }
  }

  async function changeCardStatus(cardId, status) {
    await api(`/api/cards/${encodeURIComponent(cardId)}/status`, {
      method: "POST",
      body: JSON.stringify({ status }),
    });
    patchCard(cardId, status);
    showToast(status === "reviewed" ? "已标为校对" : status === "retired" ? "已退役" : "已撤回草稿");
    await refreshOverview();
    if (state.mode === "review") renderReview();
    else {
      renderReader();
      renderPanel();
    }
  }

  async function loadReview() {
    reader.innerHTML = `<div class="loading">正在读取待校对卡片…</div>`;
    try {
      const data = await api("/api/review?status=draft&limit=100");
      state.review = data.cards || [];
      renderReview();
    } catch (error) {
      reader.innerHTML = `<div class="empty"><p class="muted">${esc(error.message)}</p></div>`;
    }
  }

  function renderReview() {
    const cards = state.review;
    reader.innerHTML = `<div class="review-view">
      <div class="review-head">
        <div><h1>校对</h1><p>只处理草稿。校对过的卡不会自动变回草稿；退役保留历史，不删除。</p></div>
        <div class="local-note"><b>${cards.length}</b> 张待处理</div>
      </div>
      <div class="review-list">
        ${cards.length ? cards.map((card, index) => `<article class="review-item" data-card="${esc(card.id)}">
          <div class="idx">${String(index + 1).padStart(2, "0")}</div>
          <div>
            <p class="rtext">${esc(card.sentence_text || "")}</p>
            <div class="rmeta">${esc(card.source_title || "")} · ${esc(card.surface)}</div>
          </div>
          <div class="review-card">
            <p class="sense">${esc(card.sense)}</p>
            ${card.why ? `<p class="field">${esc(card.why)}</p>` : ""}
            <div class="card-actions">
              <button class="mini go" type="button" data-card-status="reviewed">标为已校对</button>
              <button class="mini stop" type="button" data-card-status="retired">退役</button>
            </div>
          </div>
        </article>`).join("") : `<p class="muted">没有待校对卡片。先用 <code>enrich</code> 生成语境卡，或所有草稿已经处理完。</p>`}
      </div>
    </div>`;
  }

  function switchMode(mode) {
    state.mode = mode;
    document.body.classList.toggle("mode-review", mode === "review");
    document.querySelectorAll(".tab").forEach((tab) => {
      const active = tab.dataset.mode === mode;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", active ? "true" : "false");
    });
    if (mode === "review") {
      loadReview();
    } else {
      renderReader();
      renderPanel();
    }
  }

  sourceList.addEventListener("click", (event) => {
    const button = event.target.closest("[data-source]");
    if (!button) return;
    loadSource(button.dataset.source).catch((error) => showToast(error.message));
  });

  reader.addEventListener("click", (event) => {
    const word = event.target.closest("[data-word]");
    if (word) {
      event.preventDefault();
      selectWord(word.dataset.word);
      return;
    }
    const sentence = event.target.closest(".sentence");
    if (sentence) selectSentence(sentence.dataset.sentence, null, false);
  });

  panel.addEventListener("click", (event) => {
    const word = event.target.closest("[data-word]");
    if (word) { selectWord(word.dataset.word); return; }
    const goto = event.target.closest("[data-goto]");
    if (goto) { selectSentence(goto.dataset.goto, null, true); return; }
    const action = event.target.closest("[data-card-status]");
    if (action) {
      const card = action.closest("[data-card]");
      if (card) changeCardStatus(card.dataset.card, action.dataset.cardStatus).catch((error) => showToast(error.message));
    }
  });

  reader.addEventListener("click", (event) => {
    const action = event.target.closest("[data-card-status]");
    if (action) {
      const card = action.closest("[data-card]");
      if (card) changeCardStatus(card.dataset.card, action.dataset.cardStatus).catch((error) => showToast(error.message));
    }
  });

  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => switchMode(tab.dataset.mode));
  });

  document.addEventListener("keydown", (event) => {
    if (state.mode !== "read" || !state.source?.sentences?.length) return;
    if (event.target.closest("input, textarea")) return;
    if (event.key === "Escape") { selectSentence(state.sentenceId, null, false); return; }
    if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
    event.preventDefault();
    const sentences = state.source.sentences;
    const index = sentences.findIndex((sentence) => sentence.id === state.sentenceId);
    const next = sentences[index + (event.key === "ArrowDown" ? 1 : -1)];
    if (next) selectSentence(next.id, null, true);
  });

  async function boot() {
    try {
      state.overview = await api("/api/overview");
      renderSources();
      if (state.overview.sources.length) {
        await loadSource(state.overview.sources[0].id);
      } else {
        renderReader();
      }
    } catch (error) {
      reader.innerHTML = `<div class="empty"><h1>读不到本地库</h1><p class="muted">${esc(error.message)}</p></div>`;
    }
  }

  boot();
})();
</script>
</body>
</html>
